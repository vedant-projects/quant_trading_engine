[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "personal-quant-trading-engine"
version = "0.1.0"
description = "A personal, paper-first quantitative trading engine."
requires-python = ">=3.12,<3.13"

dependencies = [
    # API and configuration
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "python-dotenv>=1.0,<2",

    # Database and migrations
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",

    # Background jobs and caching
    "celery[redis]>=5.4,<6",
    "redis>=5,<7",

    # Networking and logging
    "httpx>=0.27,<1",
    "websockets>=13,<16",
    "structlog>=24,<27",

    # Numerical work and historical data
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "scipy>=1.14,<2",
    "yfinance>=0.2,<1",
    "ccxt>=4,<5",

    # Local dashboard
    "streamlit>=1.39,<2",
    "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "pytest-cov>=5,<8",
    "hypothesis>=6,<7",
    "ruff==0.9.10",
    "mypy>=1.13,<2",
    "pre-commit>=4,<5",
]

research = [
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
    "sympy>=1.13,<2",
    "statsmodels>=0.14,<1",
]

alpaca = [
    "alpaca-py>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    "venv",
    "notebooks",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: tests requiring database, Redis, or another service",
    "broker: tests requiring an explicitly configured broker sandbox",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict = true

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "kombu",
    "kombu.*",
]
ignore_missing_imports = true